[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-atlas"
version = "2.0.0"
description = "Local-first, source-backed project knowledge compiler generating an OKF-oriented Obsidian vault."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
orch = [
    "cursor-sdk>=1.0.25,<1.1",
]

[project.urls]
Homepage = "https://github.com/WezzSide/project-atlas"
Repository = "https://github.com/WezzSide/project-atlas"

[project.scripts]
atlas = "project_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
project_atlas = ["schemas/*.json", "data/*.json", "py.typed"]
atlas_contracts = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=project_atlas --cov-report=term-missing --cov-report=xml --no-cov-on-fail"
markers = [
    "integration: end-to-end and cross-component tests",
    "security_regression: Alpha security regression suite seed / class guards (S08)",
    "product_perf: dense product-performance gate calibrated uncovered (AS-CI-WINDOWS-PERF-GATE-001)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Lint scope is the project package only; sibling directories dropped into
# the repo root (e.g. atlas-vault-agent-documentation-skill/) are separate
# deliverables with their own tooling.
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["project_atlas"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cursor_sdk", "cursor_sdk.*"]
ignore_missing_imports = true

[tool.atlas]
# Default configuration; see project_atlas.config for all fields.
