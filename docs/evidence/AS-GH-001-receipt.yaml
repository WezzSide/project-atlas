    branch docs/as-gh-001-artifact-closure; independent verification and
    Owner merge are still required before package closure.
  - actionlint or an equivalent workflow-syntax linter was not added;
    the governance test suite's own YAML-parse + regex-based checks
    (action pin format, permissions block, trigger set, issue-template
    YAML) cover the concrete risks this phase targets without adding a
    new third-party dependency.
  - The exact GitHub check name for this specific PR/branch is expected,
    not yet freshly re-observed on this exact diff, until the PR
    actually runs.
  - CODEOWNERS review enforcement, required-check branch-protection
    activation, and restoring required approving reviews to 1 all
    remain separate, later, independently-verified phases (AS-GH-002
    hint); none is claimed here.
  - No dedicated conduct-enforcement email or external support intake
    is published; CODE_OF_CONDUCT.md and SUPPORT.md document that
    limitation truthfully rather than inventing contacts.

