name: atlas-agent-execute

# ATLAS-RUNNER-FABRIC-001 — agent execution workflow (executor side).
#
# Executor-only workflow; independent verification is atlas-runner-verify.yml.
# EXECUTOR_SUCCESS != VERIFIED. This workflow proposes changes on a dedicated
# branch; it NEVER merges, never touches the default branch, and never
# self-certifies.
#
# Anthropic auth: ANTHROPIC_API_KEY repository secret (documented direct-API
# path of anthropics/claude-code-action). The OIDC workload-identity-federation
# path (id-token: write + anthropic_federation_rule_id) is the recommended
# upgrade but requires Anthropic Console provisioning:
# NOT_RUN_REQUIRES_EXTERNAL_AUTHORITY. The secret-based path needs no
# id-token: write, so it is not granted.
#
# Branch model: workflow_dispatch always runs from a branch; the workflow
# creates its own dedicated branch atlas/agent-<run_id>-<attempt> from the
# input base_branch. Outputs land only there.

on:
  workflow_dispatch:
    inputs:
      task_prompt:
        description: "Bounded task for the agent (scope-limited prompt)."
        required: true
        type: string
      base_branch:
        description: "Base branch to start the dedicated agent branch from."
        required: true
        type: string
        default: "main"
      agent_type:
        description: "Agent backend."
        required: true
        type: choice
        options:
          - claude
        default: "claude"

permissions:
  contents: write # create + push the dedicated atlas/agent-<run_id> branch only

concurrency:
  group: atlas-agent-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.event.repository.fork == false
    runs-on: [self-hosted, linux, x64, atlas, executor]
    timeout-minutes: 20
    steps:
      - name: Validate base_branch shape (fail closed on injection)
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail
          case "${BASE_BRANCH}" in
            (*..*|/*|*.git|*" "*) echo "invalid base_branch" >&2; exit 2 ;;
          esac
          case "${BASE_BRANCH}" in
            (*[!A-Za-z0-9._/-]*) echo "invalid base_branch characters" >&2; exit 2 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      # EXECUTOR_PY312_BOOTSTRAP: Python >= 3.12 is a guarantee of the
      # digest-pinned worker image (infra/atlas-runner/Dockerfile), not a
      # job-time download (actions/setup-python has no Debian 12 build). Verify
      # the contract and fail BEFORE any agent execution; never fall back to an
      # older interpreter.
      - name: Verify executor Python toolchain (fail closed)
        run: |
          set -euo pipefail
          command -v python3 >/dev/null || { echo "python3 missing from executor image" >&2; exit 3; }
          python3 -c 'import sys; assert sys.version_info >= (3, 12), "Python >=3.12 required, found " + sys.version'
          python3 -m pip --version
          python3 -m venv --help >/dev/null
          {
            echo "### Executor Python toolchain"
            echo "python: $(python3 -c 'import sys; print(sys.version.split()[0])')"
            echo "pip: $(python3 -m pip --version)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Create isolated venv and install package with dev dependencies
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/atlas-venv"
          echo "${RUNNER_TEMP}/atlas-venv/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/atlas-venv/bin/python" -m pip install --quiet -e ".[dev]"

      - name: Create dedicated agent branch
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          branch="atlas/agent-${RUN_ID}-${RUN_ATTEMPT}"
          # run_id/run_attempt are GitHub-assigned decimal integers; validated anyway.
          case "${branch}" in atlas/agent-[0-9]*-[0-9]*) ;; *) echo "bad branch name" >&2; exit 2 ;; esac
          git checkout -b "${branch}"
          echo "AGENT_BRANCH=${branch}" >> "${GITHUB_ENV}"

      # Action input (not shell): the bounded prompt is scoped to the
      # dedicated branch and restricted via --allowedTools in claude_args.
      - name: Run agent (bounded prompt, restricted tools)
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1 (v1.0 release tag)
        with:
          prompt: |
            Bounded task for Project Atlas (branch ${{ env.AGENT_BRANCH }}):
            ${{ inputs.task_prompt }}

            Constraints: work ONLY in this checkout; do not push, merge, or
            rewrite history; make the smallest change that satisfies the task;
            run the infra runner test suite before finishing.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # CLAUDE_ACTION_GITHUB_AUTH: without this input the pinned action's
          # setupGitHubToken() falls back to a GitHub OIDC -> App-token exchange
          # (requires id-token: write, which this workflow deliberately does
          # not grant) and fails before the model starts. With it, the action
          # uses the job's own GITHUB_TOKEN directly; the permission envelope
          # (contents: write only) is unchanged and no OIDC token is requested.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          base_branch: ${{ env.AGENT_BRANCH }}
          claude_args: |
            --max-turns 20
            --allowedTools Edit Read Write Glob Grep Bash(pytest:*) Bash(ruff:*) Bash(bash:*)

      - name: Deterministic tests (infra runner subset)
        env:
          PYTHONPATH: src
        run: python -m pytest infra/atlas-runner/tests -q --no-cov -p no:cacheprovider

      - name: Commit and push dedicated branch
        env:
          GH_TOKEN_PUSH: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "no changes produced; nothing to push"
            exit 0
          fi
          git config user.name "atlas-agent-executor"
          git config user.email "atlas-agent-executor@users.noreply.github.com"
          git add -A
          git commit -m "atlas-agent: execute bounded task (run ${RUN_ID} attempt ${RUN_ATTEMPT})"
          git remote set-url origin "https://x-access-token:${GH_TOKEN_PUSH}@github.com/${GH_REPOSITORY}.git"
          git push -u origin "HEAD:${AGENT_BRANCH}"

      - name: Smoke workload (evidence fragment)
        run: bash infra/atlas-runner/scripts/smoke-workload.sh

      - name: Upload executor evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-agent-execute-evidence
          path: |
            smoke-manifest.json
            evidence/
          if-no-files-found: error
