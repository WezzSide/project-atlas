name: atlas-agent-execute

# ATLAS-RUNNER-FABRIC-001 — agent execution workflow (executor side).
#
# Executor-only workflow; independent verification is atlas-runner-verify.yml.
# EXECUTOR_SUCCESS != VERIFIED. This workflow proposes changes on a dedicated
# branch; it NEVER merges, never touches the default branch, and never
# self-certifies.
#
# Anthropic auth: ANTHROPIC_API_KEY repository secret (documented direct-API
# path of anthropics/claude-code-action). The OIDC workload-identity-federation
# path (id-token: write + anthropic_federation_rule_id) is the recommended
# upgrade but requires Anthropic Console provisioning:
# NOT_RUN_REQUIRES_EXTERNAL_AUTHORITY. The secret-based path needs no
# id-token: write, so it is not granted.
#
# Branch model: workflow_dispatch always runs from a branch; the workflow
# creates its own dedicated branch atlas/agent-<run_id>-<attempt> from the
# input base_branch. Outputs land only there.

on:
  workflow_dispatch:
    inputs:
      task_prompt:
        description: "Bounded task for the agent (scope-limited prompt)."
        required: true
        type: string
      base_branch:
        description: "Base branch to start the dedicated agent branch from."
        required: true
        type: string
        default: "main"
      agent_type:
        description: "Agent backend."
        required: true
        type: choice
        options:
          - claude
        default: "claude"

permissions:
  contents: write # create + push the dedicated atlas/agent-<run_id> branch only

concurrency:
  group: atlas-agent-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.event.repository.fork == false
    runs-on: [self-hosted, linux, x64, atlas, executor]
    timeout-minutes: 20
    steps:
      - name: Validate base_branch shape (fail closed on injection)
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail
          case "${BASE_BRANCH}" in
            (*..*|/*|*.git|*" "*) echo "invalid base_branch" >&2; exit 2 ;;
          esac
          case "${BASE_BRANCH}" in
            (*[!A-Za-z0-9._/-]*) echo "invalid base_branch characters" >&2; exit 2 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      # EXECUTOR_PY312_BOOTSTRAP: Python >= 3.12 is a guarantee of the
      # digest-pinned worker image (infra/atlas-runner/Dockerfile), not a
      # job-time download (actions/setup-python has no Debian 12 build). Verify
      # the contract and fail BEFORE any agent execution; never fall back to an
      # older interpreter.
      - name: Verify executor Python toolchain (fail closed)
        run: |
          set -euo pipefail
          command -v python3 >/dev/null || { echo "python3 missing from executor image" >&2; exit 3; }
          python3 -c 'import sys; assert sys.version_info >= (3, 12), "Python >=3.12 required, found " + sys.version'
          python3 -m pip --version
          python3 -m venv --help >/dev/null
          {
            echo "### Executor Python toolchain"
            echo "python: $(python3 -c 'import sys; print(sys.version.split()[0])')"
            echo "pip: $(python3 -m pip --version)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Create isolated venv and install package with dev dependencies
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/atlas-venv"
          echo "${RUNNER_TEMP}/atlas-venv/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/atlas-venv/bin/python" -m pip install --quiet -e ".[dev]"

      - name: Create dedicated agent branch
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          branch="atlas/agent-${RUN_ID}-${RUN_ATTEMPT}"
          # run_id/run_attempt are GitHub-assigned decimal integers; validated anyway.
          case "${branch}" in atlas/agent-[0-9]*-[0-9]*) ;; *) echo "bad branch name" >&2; exit 2 ;; esac
          git checkout -b "${branch}"
          echo "AGENT_BRANCH=${branch}" >> "${GITHUB_ENV}"

      # Action input (not shell): the bounded prompt is scoped to the
      # dedicated branch and restricted via --allowedTools in claude_args.
      - name: Run agent (bounded prompt, restricted tools)
        id: agent
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1 (v1.0 release tag)
        with:
          prompt: |
            Bounded task for Project Atlas (branch ${{ env.AGENT_BRANCH }}):
            ${{ inputs.task_prompt }}

            Constraints: work ONLY in this checkout; do not push, merge, or
            rewrite history; make the smallest change that satisfies the task;
            run the infra runner test suite before finishing.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # CLAUDE_ACTION_GITHUB_AUTH: without this input the pinned action's
          # setupGitHubToken() falls back to a GitHub OIDC -> App-token exchange
          # (requires id-token: write, which this workflow deliberately does
          # not grant) and fails before the model starts. With it, the action
          # uses the job's own GITHUB_TOKEN directly; the permission envelope
          # (contents: write only) is unchanged and no OIDC token is requested.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          base_branch: ${{ env.AGENT_BRANCH }}
          claude_args: |
            --max-turns 20
            --allowedTools Edit Read Write Glob Grep Bash(pytest:*) Bash(ruff:*) Bash(bash:*)

      # EXECUTOR_SDK_OBSERVABILITY: the pinned action writes the full SDK message
      # sequence to $RUNNER_TEMP/claude-execution-output.json, which runner cleanup
      # deletes, while its public log deliberately hides message details
      # (show_full_output stays off). On agent-step FAILURE ONLY, reduce that file
      # to a content-minimizing summary: numbers, booleans, fixed allow-list members
      # and fixed-pattern identifiers only (SDK error enums, usage counters, api_retry
      # counters, an unauthenticated reachability probe of api.anthropic.com).
      # Free-form text (results, errors, assistant/tool content, prompts) is excluded
      # structurally, never merely redacted; unknown values become "other". The output
      # is always valid JSON (bounded before serialization, minimal fail-safe object on
      # overflow). The step runs inline (not from the agent-writable checkout), reads
      # its temp dir from step-level env (not GITHUB_ENV-overridable), has no
      # production bypass hook, receives no secrets, and cannot turn the failed agent
      # step into a success.
      - name: Claude SDK failure diagnostics (sanitized, failure-only)
        id: sdk_diag
        if: ${{ failure() && steps.agent.outcome == 'failure' }}
        continue-on-error: true
        env:
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          # Step-level env wins over anything an earlier step wrote to GITHUB_ENV.
          DIAG_TEMP: ${{ runner.temp }}
        run: |
          set -uo pipefail
          python3 -I - <<'ATLAS_SDK_DIAG'
          import json
          import math
          import os
          import re
          import socket
          import ssl
          import urllib.error
          import urllib.request

          # Content-minimizing by construction: every persisted value is a number, a boolean, a
          # member of a fixed allow-list, or a string matching a fixed narrow pattern. Anything
          # else becomes "other" (or null). No source text is ever copied, repr()'d or sliced.
          TMP = os.environ.get("DIAG_TEMP") or "/tmp"
          SRC = os.path.join(TMP, "claude-execution-output.json")
          OUT = os.path.join(TMP, "claude-sdk-diagnostic.json")
          PROBE_URL = "https://api.anthropic.com/"
          MAX_IN, MAX_OUT, MAX_RETRY, MAX_KEYS = 64 * 1024 * 1024, 16 * 1024, 25, 20
          ERRORS = {
              "authentication_failed", "oauth_org_not_allowed", "account_on_hold", "verification_required",
              "billing_error", "rate_limit", "overloaded", "invalid_request", "model_not_found",
              "server_error", "unknown", "max_output_tokens", "cloud_credential_error",
          }
          MSG_TYPES = {
              "system", "assistant", "user", "result", "stream_event", "tool_progress", "auth_status",
              "tool_use_summary", "rate_limit_event", "prompt_suggestion",
          }
          SUBTYPES = {
              "init", "api_retry", "status", "compact_boundary", "hook_started", "hook_progress",
              "hook_response", "task_notification", "files_persisted", "success", "error_max_turns",
              "error_during_execution", "error_max_budget_usd", "error_max_structured_output_retries",
          }
          KEY_SOURCES = {"user", "project", "org", "temporary", "oauth", "none", "ANTHROPIC_API_KEY"}
          PERM_MODES = {"default", "acceptEdits", "bypassPermissions", "plan", "dontAsk", "auto"}
          MCP_STATUS = {"connected", "failed", "needs-auth", "pending", "disabled"}
          STOP_REASONS = {
              "end_turn", "max_tokens", "stop_sequence", "tool_use", "pause_turn", "refusal",
          }
          TERMINAL = {
              "completed", "max_turns", "aborted_streaming", "aborted_tools", "prompt_too_long",
              "blocking_limit", "model_error", "image_error", "stop_hook_prevented", "hook_stopped",
          }
          OUTCOMES = {"failure", "success", "skipped", "cancelled"}
          PARSE_ERRORS = {
              "JSONDecodeError", "UnicodeDecodeError", "OSError", "MemoryError", "RecursionError",
              "ValueError", "TypeError", "KeyError",
          }
          PROBE_ERRORS = {
              "TimeoutError", "timeout", "gaierror", "ConnectionRefusedError", "ConnectionResetError",
              "ConnectionAbortedError", "SSLError", "SSLCertVerificationError", "SSLEOFError",
              "OSError", "herror",
          }
          MODEL_RX = re.compile(r"claude-[a-z0-9][a-z0-9.\-]{0,60}")
          VERSION_RX = re.compile(r"[0-9]{1,3}(\.[0-9]{1,4}){1,3}")
          USAGE_KEYS = (
              "inputTokens", "outputTokens", "cacheReadInputTokens", "cacheCreationInputTokens",
              "costUSD", "contextWindow", "maxOutputTokens",
          )


          def pick(v, allowed):
              """Member of a fixed allow-list, else "other"; None stays None."""
              if v is None:
                  return None
              return v if isinstance(v, str) and v in allowed else "other"


          def match(v, rx):
              """String that fully matches a fixed narrow pattern, else "other"; None stays None."""
              if v is None:
                  return None
              return v if isinstance(v, str) and rx.fullmatch(v) else "other"


          def num(v):
              if isinstance(v, bool):
                  return None
              if isinstance(v, int):
                  return v if abs(v) <= 10**15 else None
              if isinstance(v, float):
                  return v if math.isfinite(v) and abs(v) <= 1e15 else None
              return None


          def count(bucket, key):
              key = key if (key in bucket or len(bucket) < MAX_KEYS) else "other"
              bucket[key] = bucket.get(key, 0) + 1


          def summarize(msgs):
              out = {
                  "message_count": len(msgs), "malformed_messages": 0, "types": {},
                  "api_retries": [], "assistant_errors": {}, "api_retry_total": 0,
              }
              last_result = None
              for m in msgs:
                  try:
                      if not isinstance(m, dict):
                          out["malformed_messages"] += 1
                          continue
                      t, st = pick(m.get("type"), MSG_TYPES), pick(m.get("subtype"), SUBTYPES)
                      count(out["types"], (t or "none") + (":" + st if st else ""))
                      if t == "system" and st == "init":
                          tools, mcp = m.get("tools"), m.get("mcp_servers")
                          status = {}
                          for s in (mcp if isinstance(mcp, list) else [])[:50]:
                              if isinstance(s, dict):
                                  count(status, pick(s.get("status"), MCP_STATUS) or "none")
                          out["init"] = {
                              "model": match(m.get("model"), MODEL_RX),
                              "claude_code_version": match(m.get("claude_code_version"), VERSION_RX),
                              "apiKeySource": pick(m.get("apiKeySource"), KEY_SOURCES),
                              "permissionMode": pick(m.get("permissionMode"), PERM_MODES),
                              "tools_count": len(tools) if isinstance(tools, list) else None,
                              "mcp_status_counts": status,
                          }
                      elif t == "system" and st == "api_retry":
                          out["api_retry_total"] += 1
                          if len(out["api_retries"]) < MAX_RETRY:
                              out["api_retries"].append({
                                  "attempt": num(m.get("attempt")), "max_retries": num(m.get("max_retries")),
                                  "retry_delay_ms": num(m.get("retry_delay_ms")),
                                  "error_status": num(m.get("error_status")),
                                  "error": pick(m.get("error"), ERRORS),
                                  "waited_ms": num(m.get("waited_ms")),
                                  "retry_wait_ms": num(m.get("retry_wait_ms")),
                              })
                      elif t == "assistant":
                          e = pick(m.get("error"), ERRORS)
                          if e:
                              count(out["assistant_errors"], e)
                      elif t == "result":
                          last_result = m
                  except Exception:  # noqa: BLE001 - one hostile message must not stop the summary
                      out["malformed_messages"] += 1
              if last_result is not None:
                  r = last_result
                  usage = r.get("modelUsage") if isinstance(r.get("modelUsage"), dict) else {}
                  errs = r.get("errors")
                  denials = r.get("permission_denials")
                  model_usage = {}
                  for k, v in list(usage.items())[:5]:
                      if isinstance(v, dict):
                          key = match(k, MODEL_RX)
                          model_usage[key] = {u: num(v.get(u)) for u in USAGE_KEYS if num(v.get(u)) is not None}
                  out["result"] = {
                      "subtype": pick(r.get("subtype"), SUBTYPES),
                      "is_error": r.get("is_error") is True,
                      "duration_ms": num(r.get("duration_ms")),
                      "duration_api_ms": num(r.get("duration_api_ms")),
                      "num_turns": num(r.get("num_turns")),
                      "total_cost_usd": num(r.get("total_cost_usd")),
                      "api_error_status": num(r.get("api_error_status")),
                      "stop_reason": pick(r.get("stop_reason"), STOP_REASONS),
                      "terminal_reason": pick(r.get("terminal_reason"), TERMINAL),
                      "permission_denials_count": len(denials) if isinstance(denials, list) else 0,
                      "errors_count": len(errs) if isinstance(errs, list) else 0,
                      "errors_enums": [pick(x, ERRORS) or "other" for x in errs[:5]] if isinstance(errs, list) else [],
                      "model_usage": model_usage,
                  }
              return out


          def probe():
              try:
                  req = urllib.request.Request(PROBE_URL, method="GET")
                  with urllib.request.urlopen(req, timeout=10, context=ssl.create_default_context()) as r:
                      return {"reachable": True, "http_status": num(r.status)}
              except urllib.error.HTTPError as e:
                  return {"reachable": True, "http_status": num(e.code)}
              except urllib.error.URLError as e:
                  return {"reachable": False, "error_class": pick(type(e.reason).__name__, PROBE_ERRORS)}
              except (socket.timeout, OSError) as e:
                  return {"reachable": False, "error_class": pick(type(e).__name__, PROBE_ERRORS)}
              except Exception:  # noqa: BLE001
                  return {"reachable": False, "error_class": "other"}


          def hints(d):
              h = []
              if d.get("api_probe", {}).get("reachable") is False:
                  h.append("NETWORK_OR_TLS_TO_API_FAILED")
              retries = d.get("api_retries", [])
              errs = set(d.get("assistant_errors", {})) | {x.get("error") for x in retries}
              errs |= set(d.get("result", {}).get("errors_enums", []))
              for k, v in (("authentication_failed", "API_AUTH"), ("oauth_org_not_allowed", "API_AUTH"),
                           ("billing_error", "API_BILLING_OR_ENTITLEMENT"),
                           ("account_on_hold", "API_BILLING_OR_ENTITLEMENT"),
                           ("model_not_found", "MODEL_ENTITLEMENT_OR_NAME"), ("rate_limit", "API_RATE_LIMIT"),
                           ("overloaded", "API_OVERLOADED"), ("server_error", "API_SERVER_ERROR"),
                           ("invalid_request", "API_INVALID_REQUEST")):
                  if k in errs:
                      h.append(v)
              if any(x.get("error_status") is None for x in retries):
                  h.append("API_CONNECTION_NO_HTTP_RESPONSE")
              r = d.get("result", {})
              if r.get("is_error") and not r.get("model_usage") and not h:
                  h.append("NO_MODEL_USAGE_CAUSE_UNCLASSIFIED")
              return h


          def dump(d):
              return json.dumps(d, indent=2, sort_keys=True, allow_nan=False)


          def render(d):
              """Always returns a valid JSON document no larger than MAX_OUT bytes."""
              d["diagnostic_truncated"] = False
              tiers = (
                  (),
                  ("api_retries", "types", "init"),
                  ("api_retries", "types", "init", "result", "assistant_errors", "api_retry_total",
                   "message_count", "malformed_messages"),
              )
              for i, drop in enumerate(tiers):
                  view = {k: v for k, v in d.items() if k not in drop}
                  view["diagnostic_truncated"] = i > 0
                  try:
                      text = dump(view)
                  except Exception:  # noqa: BLE001
                      continue
                  if len(text.encode("utf-8")) <= MAX_OUT:
                      return text
              return dump({"schema": 1, "diagnostic_truncated": True, "parse_error": "other"})


          def main():
              d = {"schema": 1, "agent_step_outcome": pick(os.environ.get("AGENT_OUTCOME"), OUTCOMES),
                   "execution_file_present": os.path.isfile(SRC)}
              try:
                  if d["execution_file_present"]:
                      size = os.path.getsize(SRC)
                      d["execution_file_bytes"] = num(size)
                      if size > MAX_IN:
                          d["parse_error"] = "file_too_large"
                      else:
                          with open(SRC, encoding="utf-8") as fh:
                              msgs = json.load(fh)
                          if isinstance(msgs, list):
                              d.update(summarize(msgs))
                          else:
                              d["parse_error"] = "not_a_message_list"
              except Exception as exc:  # noqa: BLE001 - diagnostics must never raise
                  d["parse_error"] = pick(type(exc).__name__, PARSE_ERRORS)
              d["api_probe"] = probe()
              d["classification_hints"] = hints(d)
              return render(d)


          try:
              text = main()
          except Exception:  # noqa: BLE001
              text = dump({"schema": 1, "diagnostic_truncated": True, "parse_error": "other"})
          try:
              with open(OUT, "w", encoding="utf-8") as fh:
                  fh.write(text + "\n")
          except OSError:
              pass
          print("[sdk-diagnostic] sanitized summary (no prompts, tool payloads, transcripts or free text):")
          print(text)
          ATLAS_SDK_DIAG

      - name: Upload sanitized SDK diagnostic
        if: ${{ failure() && steps.agent.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-agent-sdk-diagnostic
          path: ${{ runner.temp }}/claude-sdk-diagnostic.json
          if-no-files-found: warn
          retention-days: 14

      - name: Deterministic tests (infra runner subset)
        env:
          PYTHONPATH: src
        run: python -m pytest infra/atlas-runner/tests -q --no-cov -p no:cacheprovider

      - name: Commit and push dedicated branch
        env:
          GH_TOKEN_PUSH: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "no changes produced; nothing to push"
            exit 0
          fi
          git config user.name "atlas-agent-executor"
          git config user.email "atlas-agent-executor@users.noreply.github.com"
          git add -A
          git commit -m "atlas-agent: execute bounded task (run ${RUN_ID} attempt ${RUN_ATTEMPT})"
          git remote set-url origin "https://x-access-token:${GH_TOKEN_PUSH}@github.com/${GH_REPOSITORY}.git"
          git push -u origin "HEAD:${AGENT_BRANCH}"

      - name: Smoke workload (evidence fragment)
        run: bash infra/atlas-runner/scripts/smoke-workload.sh

      - name: Upload executor evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-agent-execute-evidence
          path: |
            smoke-manifest.json
            evidence/
          if-no-files-found: error
