name: atlas-runner-ci

# ATLAS-RUNNER-FABRIC-001: CI for the runner fabric (controller tests, ruff,
# shell checks, schema checks, worker image build).
# PASS != MERGE AUTHORIZATION; green CI is a signal, never authority.

on:
  push:
    paths:
      - "infra/atlas-runner/**"
      - ".github/workflows/atlas-runner*.yml"
  pull_request:
    paths:
      - "infra/atlas-runner/**"
      - ".github/workflows/atlas-runner*.yml"

permissions:
  contents: read

concurrency:
  group: atlas-runner-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Controller test suite
        env:
          PYTHONPATH: src
        run: python -m pytest infra/atlas-runner/tests -q --no-cov -p no:cacheprovider

      - name: Ruff (infra/atlas-runner)
        run: python -m ruff check --config infra/atlas-runner/pyproject.toml infra/atlas-runner

      - name: Shell syntax (bash -n)
        run: |
          set -euo pipefail
          for script in infra/atlas-runner/scripts/*.sh infra/atlas-runner/entrypoint.sh; do
            bash -n "${script}"
            echo "bash -n OK: ${script}"
          done

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck (-S warning)
        run: shellcheck -S warning infra/atlas-runner/scripts/*.sh infra/atlas-runner/entrypoint.sh

      - name: JSON Schema validity check (4 schemas)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import jsonschema

          schema_dir = Path("infra/atlas-runner/schemas")
          for path in sorted(schema_dir.glob("*.schema.json")):
              schema = json.loads(path.read_text(encoding="utf-8"))
              validator_class = jsonschema.validators.validator_for(schema)
              validator_class.check_schema(schema)
              print(f"schema OK: {path}")
          assert len(list(schema_dir.glob("*.schema.json"))) == 4, "expected exactly 4 schemas"
          PY

  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only; never push from CI. Base image and runner version are
      # pinned in the Dockerfile (digest / RUNNER_VERSION arg).
      - name: Build worker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/atlas-runner
          push: false
          load: true
          build-args: |
            RUNNER_VERSION=2.337.0
          cache-from: type=gha,scope=atlas-runner-image
          cache-to: type=gha,mode=max,scope=atlas-runner-image
          tags: atlas-runner-worker:ci

      - name: Verify image labels
        run: |
          set -euo pipefail
          image="atlas-runner-worker:ci"
          title="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.title"}}' "${image}")"
          version="$(docker inspect --format '{{index .Config.Labels "atlas.runner.version"}}' "${image}")"
          ephemeral="$(docker inspect --format '{{index .Config.Labels "atlas.runner.ephemeral"}}' "${image}")"
          echo "title=${title} runner_version=${version} ephemeral=${ephemeral}"
          test "${title}" = "atlas-runner-worker"
          test "${version}" = "2.337.0"
          test "${ephemeral}" = "true"
