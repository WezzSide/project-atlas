name: atlas-runner-verify

# ATLAS-RUNNER-FABRIC-001 — INDEPENDENT verification of executor evidence.
#
# Independent verifier. The executor cannot self-certify. Same-host
# executor/verifier separation is NOT host-level independence — v1 uses
# GitHub-hosted runners for that boundary (this job runs on ubuntu-latest,
# never on VPS-02).
#
# EXECUTOR_SUCCESS != VERIFIED. Verdicts: VERIFIED / REJECTED. A REJECTED
# verdict is a signal for a human; it is not itself merge authorization.
#
# Note: workflow_run only fires for runs whose workflows completed on the
# default branch, and this workflow must exist on the default branch to be
# triggered.

on:
  workflow_run:
    workflows:
      # workflow_run matches the workflow display `name:` (extensionless),
      # not the filename with .yml — the previous list never matched, which
      # is why the auto-verify path never fired in production.
      - atlas-runner-smoke
      - atlas-agent-execute
      - atlas-runner-acceptance
    types: [completed]
    # No branches: filter here — it did not match workflow_dispatch source
    # runs in production (run 36315974012 completed without triggering this
    # workflow). The default-branch gate is enforced explicitly in the
    # "Assert source run is on the default branch" step below, fail-closed.
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run id of the executor workflow run to verify."
        required: true
        type: string

permissions:
  contents: read
  actions: read # download artifacts from the source executor run

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Resolve source run id
        id: source
        env:
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [ -n "${EVENT_RUN_ID}" ]; then
            run_id="${EVENT_RUN_ID}"
          else
            run_id="${INPUT_RUN_ID}"
          fi
          # run ids are decimal integers; validate before use anywhere.
          case "${run_id}" in
            (''|*[!0-9]*) echo "invalid source run id: ${run_id}" >&2; exit 2 ;;
          esac
          echo "run-id=${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Assert source run is on the default branch
        env:
          RUN_ID: ${{ steps.source.outputs.run-id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Replaces the workflow_run `branches:` filter (which did not match
          # workflow_dispatch source runs in production). Fail closed: if the
          # source run's branch cannot be determined, refuse to verify.
          head_branch="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.head_branch')" || {
            echo "::error::cannot determine source run branch; refusing" >&2; exit 1;
          }
          if [ "${head_branch}" != "${DEFAULT_BRANCH}" ]; then
            echo "::error::source run is on '${head_branch}', not default branch '${DEFAULT_BRANCH}'; refusing" >&2
            exit 1
          fi
          echo "source run ${RUN_ID} is on default branch ${DEFAULT_BRANCH}"

      - name: Download executor evidence artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: atlas-*
          path: executor-evidence
          merge-multiple: true
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify evidence (schema, hashes, semantics) and emit report
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run-id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          import jsonschema
          sys.path.insert(0, str(Path("infra/atlas-runner")))
          from controller.verifier_labels import (
              REQUIRED_VERIFIER_LABELS,
              select_verifier_runner,
          )

          GITHUB_HOSTED_NAME = re.compile(r"^(GitHub Actions|Hosted Ubuntu|Hosted Windows|Hosted macOS)")

          ev_dir = Path("executor-evidence")
          report = {
              "verifier": "atlas-runner-verify.yml",
              "source_run_id": int(__import__("os").environ["SOURCE_RUN_ID"]),
              "checks": [],
              "verdict": None,
          }

          def record(name, ok, detail):
              report["checks"].append({"check": name, "result": "PASS" if ok else "FAIL", "detail": detail})
              print(f"{'PASS' if ok else 'FAIL'}: {name} — {detail}")

          fragment_path = ev_dir / "evidence" / "fragment.json"
          ok = fragment_path.is_file()
          record("evidence_fragment_present", ok, str(fragment_path))
          if not ok:
              report["verdict"] = "REJECTED"
              Path("verification-report.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
              print("::error::evidence fragment missing")
              sys.exit(1)

          fragment = json.loads(fragment_path.read_text(encoding="utf-8"))

          # 1. Validate every present field against the execution-evidence schema
          #    (the in-job fragment is a subset of the full evidence record, so
          #    each present key is checked against its schema definition).
          schema = json.loads(Path("infra/atlas-runner/schemas/execution-evidence.schema.json").read_text(encoding="utf-8"))
          validator_class = jsonschema.validators.validator_for(schema)
          sub_ok = True
          details = []
          for key, value in fragment.items():
              subschema = schema["properties"].get(key)
              if subschema is None:
                  sub_ok = False
                  details.append(f"unknown field {key}")
                  continue
              try:
                  validator_class(subschema).validate(value)
              except jsonschema.ValidationError as exc:
                  sub_ok = False
                  details.append(f"{key}: {exc.message}")
          record("fragment_fields_match_schema", sub_ok, "; ".join(details) or "all present fields conform")

          # 2. Recompute artifact SHA-256 and compare to the claimed digest.
          hash_ok = True
          hash_details = []
          claimed = fragment.get("artifact_sha256", {})
          for name, digest in claimed.items():
              artifact = ev_dir / name
              if not artifact.is_file():
                  hash_ok = False
                  hash_details.append(f"missing artifact {name}")
                  continue
              actual = hashlib.sha256(artifact.read_bytes()).hexdigest()
              if actual != digest:
                  hash_ok = False
                  hash_details.append(f"{name}: claimed {digest} != actual {actual}")
              else:
                  hash_details.append(f"{name}: {actual}")
          record("artifact_sha256_recomputed", hash_ok, "; ".join(hash_details) or "no artifacts claimed")

          # 3. Runner identity (MANDATORY, Band D): sourced from the GitHub
          #    jobs API — the canonical full evidence for runner identity —
          #    instead of pass-with-note on a fragment omission. Unavailable
          #    mandatory evidence yields UNESTABLISHED, never a silent PASS.
          import urllib.request
          import os as _os

          runner_name_api = None
          runner_labels_api = None
          api_error = None
          try:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{_os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{report['source_run_id']}/jobs?per_page=100",
                  headers={
                      "Authorization": f"Bearer {_os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  jobs_payload = json.loads(resp.read().decode("utf-8"))
              runner_name_api, runner_labels_api = select_verifier_runner(jobs_payload)
          except Exception as exc:  # noqa: BLE001 - any API failure is UNESTABLISHED
              api_error = str(exc)[:200]

          if api_error is not None:
              record("runner_identity_from_api", False, f"jobs API unavailable: {api_error}")
              report["verdict"] = "UNESTABLISHED"
          elif not runner_name_api:
              record("runner_identity_from_api", False, "no atlas/self-hosted job found in source run")
              report["verdict"] = "UNESTABLISHED"
          else:
              name_ok = not GITHUB_HOSTED_NAME.match(str(runner_name_api))
              labels = set(runner_labels_api or [])
              label_ok = labels == REQUIRED_VERIFIER_LABELS
              record(
                  "runner_identity_from_api",
                  name_ok and label_ok,
                  f"runner_name={runner_name_api} labels={sorted(labels)}",
              )

          # Fragment-carried identity (CONTEXT_DEPENDENT): when the fragment
          # includes runner fields they must agree with the API-sourced truth.
          frag_name = fragment.get("runner_name")
          if frag_name is not None and runner_name_api is not None:
              record("fragment_runner_name_matches_api", frag_name == runner_name_api,
                     f"fragment={frag_name} api={runner_name_api}")

          # 4. cleanup_status semantics (when present).
          # CONTEXT_DEPENDENT: the fragment may legitimately omit cleanup;
          # when present it must be a known value. (Full canonical cleanup
          # evidence ships in the host-side evidence record.)
          cleanup = fragment.get("cleanup_status")
          if cleanup is None:
              record("cleanup_status", True, "NOT_PRESENT (context-dependent; full evidence is host-side)")
          else:
              record("cleanup_status_ok", cleanup in {"ok", "failed", "unknown"}, f"cleanup_status={cleanup}")

          # 5. terminal_status semantics: a 'complete' claim requires a
          #    non-empty tests section AND exit_code 0, else REJECTED.
          terminal = fragment.get("terminal_status")
          exit_code = fragment.get("exit_code", fragment.get("runner_exit_code"))
          tests = fragment.get("tests") or {}
          if terminal == "complete":
              sem_ok = bool(tests) and exit_code == 0
              record("complete_claim_semantics", sem_ok,
                     f"terminal=complete requires tests non-empty AND exit_code 0; tests={len(tests)} exit_code={exit_code}")
          elif terminal is None:
              # Fragments without terminal_status carry a self-test marker instead.
              sem_ok = bool(tests)
              record("complete_claim_semantics", sem_ok,
                     "terminal_status NOT_PRESENT in fragment; requiring non-empty tests section")
          else:
              sem_ok = True
              record("complete_claim_semantics", True, f"terminal_status={terminal} (not a complete claim)")

          # Band D verdict semantics: VERIFIED means every REQUIRED assertion
          # was actually evidenced. Violations -> REJECTED. Mandatory evidence
          # unavailable (e.g. runner identity API unreachable) -> UNESTABLISHED.
          all_ok = all(c["result"] == "PASS" for c in report["checks"])
          if report["verdict"] == "UNESTABLISHED":
              pass  # already set by the mandatory-evidence path
          else:
              report["verdict"] = "VERIFIED" if all_ok else "REJECTED"
          Path("verification-report.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(f"VERDICT: {report['verdict']}")
          summary = Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## Atlas Runner Independent Verification\n\n")
              handle.write(f"- Source run: `{report['source_run_id']}`\n")
              for check in report["checks"]:
                  handle.write(f"- **{check['result']}** — {check['check']}: {check['detail']}\n")
              handle.write(f"\n**Verdict: {report['verdict']}**\n")
          if report["verdict"] in {"REJECTED", "UNESTABLISHED"}:
              print(f"::error::verification {report['verdict']} for run {report['source_run_id']}")
              sys.exit(1)
          PY

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-verification-report
          path: verification-report.json
          if-no-files-found: error
